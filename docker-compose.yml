version: '3.8'

services:
  api:
    build: .
    container_name: transport_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/flotte_db
      - JWT_SECRET=supersecretkey12345
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: transport_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    container_name: transport_redis
    restart: always
    ports:
      - "6379:6379"
volumes:
  mongo_data: